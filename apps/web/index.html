<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>District: Common Ground</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1a1a2e;
        font-family: monospace;
      }

      body {
        display: block;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* Phaser canvas will be appended here */
      #game-container canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* HTML overlay root — HUD, dialogue, modals sit here */
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Elements inside ui-root that need interaction re-enable pointer events */
      #ui-root .interactive {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
