<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2c18" />
    <meta name="description" content="A top-down community resilience game. Build solidarity, survive crises, shape the neighbourhood." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Common Ground" />
    <!-- Open Graph / Social Share -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="District: Common Ground" />
    <meta property="og:description" content="Build solidarity. Survive crises. Shape the neighbourhood." />
    <meta property="og:image" content="icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="District: Common Ground" />
    <meta name="twitter:description" content="Build solidarity. Survive crises. Shape the neighbourhood." />
    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>District: Common Ground</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ui-bg, #1a1a2e);
        font-family: var(--ui-font, monospace);
      }

      body {
        display: block;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* no jump when the mobile address bar shows/hides */
        overflow: hidden;
        touch-action: none; /* pinch-zoom still works on the HTML UI, not the canvas */
      }

      /* Boot screen — shown until the game is ready, or with a Retry button
         if boot fails (a failure used to leave a blank page). */
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        background: #1a1a2e;
        color: #e8eef6;
        font-family: ui-monospace, monospace;
      }
      #boot-screen[hidden] { display: none; }
      .boot-title { font-size: 1.3rem; margin: 0; color: #66dd88; }
      .boot-status { margin: 0; font-size: 0.85rem; opacity: 0.8; }
      .boot-spinner {
        width: 2rem; height: 2rem;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #66dd88;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
      .boot-retry {
        font: inherit; padding: 0.6rem 1.2rem; border-radius: 999px;
        border: 1px solid #55aa66; background: #14301c; color: #88ffaa; cursor: pointer;
      }

      /* Phaser canvas will be appended here — crisp pixel-art rendering is
         the default (matches every M22 uiKit fallback); a skin whose uiKit
         sets pixelArt:false flips html[data-pixel-art="false"] (see
         ThemeManager.applyUiKit) to smooth it out instead. */
      #game-container canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      html[data-pixel-art="false"] #game-container canvas {
        image-rendering: auto;
      }

      /* HTML overlay root — HUD, dialogue, modals sit here.
         Deliberately a SIBLING of #game-container (see markup below), not a
         child — #game-container carries world-mood CSS filters
         (world--crisis/emergency/etc, style.css) which composite over every
         descendant as one rendered layer. Nesting #ui-root inside it meant
         those filters desaturated/pulsed the entire HUD and every modal too,
         not just the Phaser canvas. position:fixed + inset:0 keeps it
         viewport-aligned exactly as before, since #game-container is itself
         a borderless 100vw/100vh box at position:relative. */
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Elements inside ui-root that need interaction re-enable pointer events */
      #ui-root .interactive {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="ui-root"></div>
    <div id="boot-screen" role="status" aria-live="polite">
      <p class="boot-title">District: Common Ground</p>
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-status">Loading the neighbourhood…</p>
      <noscript><p class="boot-status">This game needs JavaScript to run.</p></noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
