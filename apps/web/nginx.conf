server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/plain application/javascript text/css application/json image/svg+xml application/manifest+json;
  server_tokens off;

  # ── Security headers (2026-09-29 launch audit §4.5) ────────────────────────
  # The CSP has to stay compatible with the plugin sandbox: sandboxed plugin
  # iframes are built from srcdoc/blob: documents (inline bootstrap script),
  # and the Plugin Library / weather / map lookups fetch from other https
  # origins. What it still blocks: framing by other sites, <object>/<embed>,
  # <base> hijacking, plain-http connections, and scripts from other origins.
  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https:; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self), bluetooth=(self), serial=(self)" always;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # uptime checks: reports the API (and so the database pool) as healthy
  location = /health {
    proxy_pass http://api:8080/health;
    add_header Cache-Control "no-store" always;
  }

  # ── Caching (2026-09-29 launch audit §4.2) ────────────────────────────────
  # Only Vite's content-hashed build output is safe to cache forever. The
  # plugin bundles (/plugins/*), the service worker and the HTML keep stable
  # file names, so they must be revalidated or updates never reach players.
  # (add_header in a location replaces the server-level ones, so the security
  # headers are repeated via include-style duplication below.)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location /plugins/ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self), bluetooth=(self), serial=(self)" always;
    try_files $uri $uri/ /index.html;
  }
}
