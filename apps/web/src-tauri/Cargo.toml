[package]
name = "district-common-ground"
version = "0.1.0"
description = "District: Common Ground — offline-first desktop shell (M18)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "district-common-ground"
path = "src/main.rs"
