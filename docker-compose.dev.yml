services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
      target: builder
    command: go run ./cmd/server
    volumes:
      - ./apps/api:/app
      - /app/vendor
    environment:
      GO_ENV: development

  web:
    build:
      context: ./apps/web
      target: builder
    command: npm run dev -- --host 0.0.0.0 --port 9300
    ports:
      - "9300:9300"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
