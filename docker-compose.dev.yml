services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: builder
    command: sh -c "cd apps/api && go run ./cmd/server"
    ports:
      - "8080:8080"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/go:/app/packages/go
    environment:
      GO_ENV: development
    # `go run` never restarts itself on its own, and Compose watch refuses to
    # `sync`/`sync+restart` any path that's also bind-mounted (see the
    # volumes above) — it just logs a warning and does nothing. `rebuild`
    # isn't subject to that restriction, so it's the only action that
    # actually fires here; it also covers go.mod/go.sum changes needing a
    # fresh `go mod download`, so no separate rule is needed for those.
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
        - action: rebuild
          path: ./packages/go

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: builder
    command: npm run dev -- --host 0.0.0.0 --port 9300
    ports: !override
      - "9300:9300"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared-types:/app/packages/shared-types
      - ./packages/minigame-courier-rush:/app/packages/minigame-courier-rush
      - ./packages/minigame-tenant-match:/app/packages/minigame-tenant-match
      - ./packages/minigame-kitchen-rush:/app/packages/minigame-kitchen-rush
      - ./packages/minigame-solidarity-line:/app/packages/minigame-solidarity-line
      - ./packages/minigame-tool-workshop:/app/packages/minigame-tool-workshop
      - /app/node_modules
      - /app/apps/web/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    # Vite's own dev server already HMRs source edits live through the bind
    # mounts above — no sync action needed for those. The one real gap is a
    # dependency-manifest change: node_modules is preserved via the anonymous
    # volumes above, so a new/updated npm dependency needs a full image
    # rebuild (npm ci), not just a file sync, to actually get installed.
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./apps/web/package.json
